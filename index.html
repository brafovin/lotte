<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Kitty Anziehspiel</title>
<style>
  :root {
    --pink: #ff8fb1;
    --pink-dark: #ff5d8f;
    --pink-light: #ffd9e6;
    --cream: #fff5f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #ffe3ee 0%, #ffd0e4 50%, #ffc2dd 100%);
    color: #6b2d44;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    margin: 18px 0 4px;
    color: var(--pink-dark);
    font-size: clamp(26px, 5vw, 42px);
    text-shadow: 2px 2px 0 #fff;
  }
  .subtitle {
    text-align: center;
    margin: 0 0 14px;
    font-size: 15px;
    color: #a04763;
  }
  .game {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    align-items: flex-start;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  .stage {
    background: var(--cream);
    border: 6px solid #fff;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(255, 93, 143, 0.25);
    padding: 14px;
    position: sticky;
    top: 14px;
  }
  #scene {
    width: 320px;
    height: 360px;
    display: block;
    border-radius: 18px;
  }
  .panel {
    flex: 1;
    min-width: 300px;
    max-width: 560px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tab {
    border: none;
    background: #fff;
    color: var(--pink-dark);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(255, 93, 143, 0.18);
    transition: transform .1s, background .15s;
  }
  .tab:hover { transform: translateY(-2px); }
  .tab.active { background: var(--pink-dark); color: #fff; }
  .options {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 10px;
    background: rgba(255,255,255,0.55);
    padding: 12px;
    border-radius: 18px;
  }
  .option {
    background: #fff;
    border: 3px solid transparent;
    border-radius: 14px;
    padding: 6px;
    cursor: pointer;
    text-align: center;
    transition: transform .1s, border-color .15s;
  }
  .option:hover { transform: translateY(-3px); }
  .option.selected { border-color: var(--pink-dark); background: var(--pink-light); }
  .option svg { width: 56px; height: 56px; display: block; margin: 0 auto; }
  .option span { font-size: 11px; display: block; margin-top: 2px; }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .actions button {
    flex: 1;
    min-width: 120px;
    border: none;
    padding: 12px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    transition: transform .1s;
  }
  .actions button:hover { transform: translateY(-2px); }
  .btn-random { background: var(--pink-dark); }
  .btn-reset { background: #b58aa8; }
  .btn-save { background: #7ec8a8; }
  footer {
    text-align: center;
    font-size: 12px;
    color: #a04763;
    padding: 0 16px 24px;
  }
</style>
</head>
<body>
  <h1>🎀 Hello Kitty Anziehspiel 🎀</h1>
  <p class="subtitle">Klicke auf die Sachen, um Hello Kitty anzuziehen!</p>

  <div class="game">
    <div class="stage">
      <svg id="scene" viewBox="0 0 320 360" xmlns="http://www.w3.org/2000/svg">
        <!-- Hintergrund -->
        <rect id="bg" x="0" y="0" width="320" height="360" fill="#ffe3ee"/>
        <g id="bgDecor"></g>

        <!-- Körper / Outfit -->
        <g id="layerOutfit"></g>

        <!-- Kopf -->
        <g id="head" transform="translate(160 150)">
          <!-- Ohren -->
          <path d="M-78 -38 L-40 -78 L-20 -42 Z" fill="#ffffff" stroke="#e8a0bb" stroke-width="3"/>
          <path d="M78 -38 L40 -78 L20 -42 Z" fill="#ffffff" stroke="#e8a0bb" stroke-width="3"/>
          <!-- Gesicht -->
          <ellipse cx="0" cy="0" rx="84" ry="66" fill="#ffffff" stroke="#e8a0bb" stroke-width="3"/>
          <!-- Augen -->
          <ellipse cx="-30" cy="2" rx="7" ry="11" fill="#3a3a3a"/>
          <ellipse cx="30" cy="2" rx="7" ry="11" fill="#3a3a3a"/>
          <!-- Nase -->
          <ellipse cx="0" cy="20" rx="9" ry="7" fill="#f6b73c"/>
          <!-- Schnurrhaare -->
          <g stroke="#cfcfcf" stroke-width="2.5" stroke-linecap="round">
            <line x1="-44" y1="6" x2="-78" y2="-2"/>
            <line x1="-46" y1="18" x2="-80" y2="20"/>
            <line x1="-44" y1="30" x2="-76" y2="40"/>
            <line x1="44" y1="6" x2="78" y2="-2"/>
            <line x1="46" y1="18" x2="80" y2="20"/>
            <line x1="44" y1="30" x2="76" y2="40"/>
          </g>
          <!-- Accessoires am Kopf -->
          <g id="layerBow"></g>
          <g id="layerHat"></g>
          <g id="layerGlasses"></g>
        </g>
      </svg>
    </div>

    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="options" id="options"></div>
      <div class="actions">
        <button class="btn-random" onclick="randomize()">🎲 Zufall</button>
        <button class="btn-reset" onclick="resetAll()">↺ Zurücksetzen</button>
        <button class="btn-save" onclick="saveImage()">💾 Bild speichern</button>
      </div>
    </div>
  </div>

  <footer>Mit 💖 gemacht – klick dich durch und gestalte deine eigene Hello Kitty!</footer>

<script>
/* ---------- Kategorien & Items ----------
   Jedes Item liefert SVG, das in seine Ziel-Ebene gerendert wird.
   thumb = kleine Vorschau fürs Menü, draw = großes SVG für die Bühne. */

const categories = {
  bow: {
    label: "🎀 Schleife",
    target: "layerBow",
    items: {
      none:  { name: "Keine", thumb: emptyThumb(), draw: "" },
      red:   { name: "Rot",   thumb: bowThumb("#ff4d6d"), draw: bowSvg("#ff4d6d") },
      blue:  { name: "Blau",  thumb: bowThumb("#4d8bff"), draw: bowSvg("#4d8bff") },
      gold:  { name: "Gold",  thumb: bowThumb("#ffcb3d"), draw: bowSvg("#ffcb3d") },
      polka: { name: "Punkte",thumb: bowThumb("#ff7bac", true), draw: bowSvg("#ff7bac", true) },
    }
  },
  outfit: {
    label: "👗 Outfit",
    target: "layerOutfit",
    items: {
      none:    { name: "Keins",  thumb: emptyThumb(), draw: "" },
      dressPink:{ name: "Kleid", thumb: dressThumb("#ff6fa5"), draw: dressSvg("#ff6fa5") },
      dressMint:{ name: "Kleid", thumb: dressThumb("#7ed7b8"), draw: dressSvg("#7ed7b8") },
      overall: { name: "Latzhose", thumb: overallThumb("#5b8def"), draw: overallSvg("#5b8def") },
      shirt:   { name: "Shirt",  thumb: shirtThumb("#ffd24d"), draw: shirtSvg("#ffd24d") },
    }
  },
  hat: {
    label: "👒 Hut",
    target: "layerHat",
    items: {
      none:  { name: "Keiner", thumb: emptyThumb(), draw: "" },
      crown: { name: "Krone",  thumb: crownThumb(), draw: crownSvg() },
      cap:   { name: "Mütze",  thumb: capThumb("#ff5d8f"), draw: capSvg("#ff5d8f") },
      flower:{ name: "Blume",  thumb: flowerHatThumb(), draw: flowerHatSvg() },
    }
  },
  glasses: {
    label: "🕶️ Brille",
    target: "layerGlasses",
    items: {
      none:   { name: "Keine", thumb: emptyThumb(), draw: "" },
      sun:    { name: "Sonne", thumb: glassesThumb("#333"), draw: glassesSvg("#333") },
      heart:  { name: "Herz",  thumb: heartGlassesThumb(), draw: heartGlassesSvg() },
    }
  },
  bg: {
    label: "🌈 Hintergrund",
    target: "bg",
    items: {
      pink:  { name: "Rosa",   thumb: bgThumb("#ffe3ee"), color: "#ffe3ee", decor: "" },
      sky:   { name: "Himmel", thumb: bgThumb("#cdeafe"), color: "#cdeafe", decor: cloudsDecor() },
      mint:  { name: "Minze",  thumb: bgThumb("#d6f5e6"), color: "#d6f5e6", decor: "" },
      stars: { name: "Sterne", thumb: bgThumb("#2b2b5e"), color: "#2b2b5e", decor: starsDecor() },
    }
  }
};

/* ---------- SVG Bausteine ---------- */
function emptyThumb(){ return '<svg viewBox="0 0 40 40"><line x1="8" y1="8" x2="32" y2="32" stroke="#ccc" stroke-width="3"/><line x1="32" y1="8" x2="8" y2="32" stroke="#ccc" stroke-width="3"/></svg>'; }

function bowSvg(c, dots){
  const pat = dots ? '<circle cx="-22" cy="-44" r="3" fill="#fff"/><circle cx="22" cy="-44" r="3" fill="#fff"/><circle cx="0" cy="-50" r="3" fill="#fff"/>' : '';
  return `<g transform="translate(0 -44)">
    <path d="M0 0 L-34 -16 L-34 16 Z" fill="${c}" stroke="#c23" stroke-width="2"/>
    <path d="M0 0 L34 -16 L34 16 Z" fill="${c}" stroke="#c23" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="${c}" stroke="#c23" stroke-width="2"/>
    ${dots?'<circle cx="-20" cy="0" r="3" fill="#fff"/><circle cx="20" cy="0" r="3" fill="#fff"/>':''}
  </g>`;
}
function bowThumb(c, dots){ return `<svg viewBox="-40 -60 80 50">${bowSvg(c,dots)}</svg>`; }

function dressSvg(c){
  return `<g transform="translate(160 210)">
    <path d="M-46 0 Q0 -22 46 0 L70 110 Q0 135 -70 110 Z" fill="${c}" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
    <circle cx="0" cy="34" r="6" fill="#fff"/><circle cx="-24" cy="70" r="6" fill="#fff"/><circle cx="24" cy="70" r="6" fill="#fff"/>
  </g>`;
}
function dressThumb(c){ return `<svg viewBox="-70 0 140 140"><g transform="translate(0 5)"><path d="M-46 0 Q0 -22 46 0 L70 110 Q0 135 -70 110 Z" fill="${c}"/></g></svg>`; }

function overallSvg(c){
  return `<g transform="translate(160 210)">
    <path d="M-60 20 L60 20 L70 120 Q0 140 -70 120 Z" fill="${c}"/>
    <rect x="-40" y="-10" width="80" height="50" rx="8" fill="${c}"/>
    <rect x="-44" y="-26" width="14" height="40" rx="6" fill="${c}"/>
    <rect x="30" y="-26" width="14" height="40" rx="6" fill="${c}"/>
    <circle cx="-20" cy="14" r="4" fill="#ffd24d"/><circle cx="20" cy="14" r="4" fill="#ffd24d"/>
  </g>`;
}
function overallThumb(c){ return `<svg viewBox="-70 -30 140 170"><g transform="translate(0 0)"><path d="M-60 20 L60 20 L70 120 Q0 140 -70 120 Z" fill="${c}"/><rect x="-40" y="-10" width="80" height="50" rx="8" fill="${c}"/></g></svg>`; }

function shirtSvg(c){
  return `<g transform="translate(160 210)">
    <path d="M-58 18 L-40 0 Q0 -16 40 0 L58 18 L40 36 L40 110 Q0 124 -40 110 L-40 36 Z" fill="${c}"/>
    <text x="0" y="78" font-size="34" text-anchor="middle">⭐</text>
  </g>`;
}
function shirtThumb(c){ return `<svg viewBox="-60 -20 120 140"><path d="M-58 18 L-40 0 Q0 -16 40 0 L58 18 L40 36 L40 110 Q0 124 -40 110 L-40 36 Z" fill="${c}"/></svg>`; }

function crownSvg(){
  return `<g transform="translate(0 -58)">
    <path d="M-40 10 L-40 -16 L-20 4 L0 -22 L20 4 L40 -16 L40 10 Z" fill="#ffcb3d" stroke="#e0a800" stroke-width="2"/>
    <circle cx="0" cy="-20" r="4" fill="#ff4d6d"/><circle cx="-20" cy="0" r="3" fill="#4d8bff"/><circle cx="20" cy="0" r="3" fill="#4d8bff"/>
  </g>`;
}
function crownThumb(){ return `<svg viewBox="-44 -30 88 50">${crownSvg().replace('translate(0 -58)','translate(0 0)')}</svg>`; }

function capSvg(c){
  return `<g transform="translate(0 -56)">
    <path d="M-44 6 Q0 -40 44 6 Z" fill="${c}"/>
    <rect x="-46" y="2" width="92" height="10" rx="5" fill="#fff"/>
    <circle cx="0" cy="-30" r="7" fill="#fff"/>
  </g>`;
}
function capThumb(c){ return `<svg viewBox="-50 -40 100 60">${capSvg(c).replace('translate(0 -56)','translate(0 0)')}</svg>`; }

function flowerHatSvg(){
  let petals = '';
  for(let i=0;i<6;i++){ const a=i*60*Math.PI/180; petals+=`<circle cx="${Math.cos(a)*14}" cy="${-54+Math.sin(a)*14}" r="9" fill="#ff7bac"/>`; }
  return `<g>${petals}<circle cx="0" cy="-54" r="8" fill="#ffd24d"/></g>`;
}
function flowerHatThumb(){ return `<svg viewBox="-30 -30 60 60">${flowerHatSvg().replace(/-54/g,'0')}</svg>`; }

function glassesSvg(c){
  return `<g transform="translate(0 0)">
    <rect x="-44" y="-8" width="34" height="22" rx="8" fill="${c}" opacity="0.85"/>
    <rect x="10" y="-8" width="34" height="22" rx="8" fill="${c}" opacity="0.85"/>
    <line x1="-10" y1="2" x2="10" y2="2" stroke="${c}" stroke-width="4"/>
  </g>`;
}
function glassesThumb(c){ return `<svg viewBox="-50 -16 100 40">${glassesSvg(c)}</svg>`; }

function heartGlassesSvg(){
  const h = (x)=>`<path transform="translate(${x} 2) scale(0.9)" d="M0 8 C-14 -8 -28 4 -16 14 L0 26 L16 14 C28 4 14 -8 0 8 Z" fill="#ff4d6d" opacity="0.9"/>`;
  return `<g>${h(-26)}${h(26)}<line x1="-10" y1="6" x2="10" y2="6" stroke="#ff4d6d" stroke-width="4"/></g>`;
}
function heartGlassesThumb(){ return `<svg viewBox="-50 -10 100 50">${heartGlassesSvg()}</svg>`; }

function bgThumb(c){ return `<svg viewBox="0 0 40 40"><rect width="40" height="40" rx="6" fill="${c}"/></svg>`; }
function cloudsDecor(){ return `<g fill="#fff" opacity="0.9"><ellipse cx="60" cy="60" rx="34" ry="18"/><ellipse cx="250" cy="90" rx="40" ry="20"/><ellipse cx="280" cy="300" rx="30" ry="16"/></g>`; }
function starsDecor(){ let s=''; const pts=[[40,50],[120,30],[210,60],[290,40],[60,300],[260,310],[300,180],[30,180]]; pts.forEach(p=>s+=`<text x="${p[0]}" y="${p[1]}" font-size="20" fill="#fff">⭐</text>`); return s; }

/* ---------- State & Rendering ---------- */
const state = { bow:"red", outfit:"dressPink", hat:"none", glasses:"none", bg:"pink" };
let activeTab = "bow";

function render(){
  for(const key in categories){
    const cat = categories[key];
    const item = cat.items[state[key]];
    if(key === "bg"){
      document.getElementById("bg").setAttribute("fill", item.color);
      document.getElementById("bgDecor").innerHTML = item.decor || "";
    } else {
      document.getElementById(cat.target).innerHTML = item.draw || "";
    }
  }
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  for(const key in categories){
    const b = document.createElement("button");
    b.className = "tab" + (key===activeTab?" active":"");
    b.textContent = categories[key].label;
    b.onclick = ()=>{ activeTab = key; renderTabs(); renderOptions(); };
    el.appendChild(b);
  }
}

function renderOptions(){
  const el = document.getElementById("options");
  el.innerHTML = "";
  const cat = categories[activeTab];
  for(const id in cat.items){
    const item = cat.items[id];
    const d = document.createElement("div");
    d.className = "option" + (state[activeTab]===id?" selected":"");
    d.innerHTML = item.thumb + `<span>${item.name}</span>`;
    d.onclick = ()=>{ state[activeTab] = id; render(); renderOptions(); };
    el.appendChild(d);
  }
}

function randomize(){
  for(const key in categories){
    const ids = Object.keys(categories[key].items);
    state[key] = ids[Math.floor(Math.random()*ids.length)];
  }
  render(); renderOptions();
}

function resetAll(){
  Object.assign(state, { bow:"red", outfit:"dressPink", hat:"none", glasses:"none", bg:"pink" });
  render(); renderOptions();
}

function saveImage(){
  const svg = document.getElementById("scene");
  const data = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  const svgBlob = new Blob([data], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(svgBlob);
  img.onload = ()=>{
    const canvas = document.createElement("canvas");
    canvas.width = 640; canvas.height = 720;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, 640, 720);
    URL.revokeObjectURL(url);
    const a = document.createElement("a");
    a.download = "meine-hello-kitty.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  img.src = url;
}

/* ---------- Start ---------- */
renderTabs();
renderOptions();
render();
</script>
</body>
</html>
