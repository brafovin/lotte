<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der Gummispinnen-Streich</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background: #2a2440; color: #fff; overflow: hidden;
  }
  .wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; padding:10px; }
  h1 { margin:0; font-size:clamp(18px,4vw,28px); color:#ffd54a; text-shadow:2px 2px 0 #00000040; text-align:center; }
  .stage {
    position:relative; border:6px solid #fff; border-radius:18px; overflow:hidden;
    box-shadow:0 14px 36px rgba(0,0,0,0.4); background:#000;
  }
  canvas { display:block; }
  .bar { display:flex; gap:10px; align-items:center; }
  .btn {
    border:none; background:#ff7bbf; color:#fff; font-weight:bold; font-size:17px;
    padding:11px 24px; border-radius:999px; cursor:pointer; box-shadow:0 5px 14px rgba(0,0,0,0.3);
    transition:transform .1s;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn.secondary{ background:#7a6fb0; }
  .caption {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); padding:6px 16px; border-radius:999px; font-size:14px; white-space:nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🕷️ Der Gummispinnen-Streich 😆</h1>
  <div class="stage">
    <canvas id="game" width="820" height="430"></canvas>
    <div class="caption" id="caption">Klicke auf „Weiter", um die Geschichte zu starten!</div>
  </div>
  <div class="bar">
    <button class="btn" id="nextBtn">▶ Weiter</button>
    <button class="btn secondary" id="restartBtn">↻ Von vorne</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const caption = document.getElementById("caption");

/* ---------- Figuren-Definitionen (genau deine Farben) ---------- */
const chars = {
  juliet: { name:"Juliet", x:170, y:300, skin:"#f1c8a3", hair:"#1c1c1c", hairStyle:"longStraight", top:"#e23b3b", pants:"#1c1c1c", fallen:false, bubble:null, scale:1 },
  lotte:  { name:"Lotte",  x:320, y:300, skin:"#ffe0c2", hair:"#ffd86b", hairStyle:"longStraight", top:"#ff7bbf", pants:"#a9d8ff", fallen:false, bubble:null, scale:1 },
  tobi:   { name:"Tobi",   x:520, y:300, skin:"#e9b48a", hair:"#3b2a1a", hairStyle:"buzz",        top:"#ffffff", pants:"#c8ccd0", shorts:true, fallen:false, bubble:null, scale:1 },
  jamal:  { name:"Jamal",  x:660, y:300, skin:"#9c6b43", hair:"#101010", hairStyle:"curls",       top:"#1c1c1c", pants:"#1c1c1c", fallen:false, bubble:null, scale:1 },
};

let spider = { show:false, x:0, y:0 };

/* ---------- Zeichnen ---------- */
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawRoom(){
  // Wand
  ctx.fillStyle = "#6b5fa0"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#5a4f8c"; ctx.fillRect(0,0,W,70);
  // Boden
  ctx.fillStyle = "#caa46a"; ctx.fillRect(0,330,W,H-330);
  ctx.fillStyle = "#b8945c";
  for(let x=0;x<W;x+=60){ ctx.fillRect(x,330,4,H-330); }
  // Fenster mit Wetter
  ctx.fillStyle = "#cdeafe"; roundRect(80,95,150,110,10); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.strokeStyle="#fff"; ctx.lineWidth=6;
  ctx.strokeRect(80,95,150,110); ctx.beginPath(); ctx.moveTo(155,95); ctx.lineTo(155,205);
  ctx.moveTo(80,150); ctx.lineTo(230,150); ctx.stroke();
  // Sonne im Fenster
  ctx.fillStyle="#ffd54a"; ctx.beginPath(); ctx.arc(120,128,16,0,Math.PI*2); ctx.fill();
  // Bild an der Wand
  ctx.fillStyle="#ffd54a"; roundRect(600,100,120,90,8); ctx.fill();
  ctx.fillStyle="#6b5fa0"; ctx.fillRect(610,110,100,70);
  ctx.fillStyle="#ff7bbf"; ctx.beginPath(); ctx.arc(660,150,18,0,Math.PI*2); ctx.fill();
}

function drawChar(c){
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.scale, c.scale);
  if(c.fallen){ ctx.rotate(-Math.PI/2 * (c.side===undefined?1:c.side)); ctx.translate(0,-10); }

  const skin=c.skin, top=c.top, pants=c.pants;
  // Beine / Hose
  ctx.fillStyle = pants;
  const legH = c.shorts ? 26 : 54;
  roundRect(-16, 18, 13, legH, 5); ctx.fill();
  roundRect(  3, 18, 13, legH, 5); ctx.fill();
  if(c.shorts){ // nackte Unterschenkel
    ctx.fillStyle=skin; roundRect(-15,44,11,24,5); ctx.fill(); roundRect(4,44,11,24,5); ctx.fill();
  }
  // Schuhe
  ctx.fillStyle="#3a3a3a"; roundRect(-18, c.shorts?66:70, 16,8,3); ctx.fill(); roundRect(2, c.shorts?66:70,16,8,3); ctx.fill();
  // Oberteil
  ctx.fillStyle = top; roundRect(-20,-26,40,48,10); ctx.fill();
  // Arme
  ctx.fillStyle = top; roundRect(-28,-22,11,34,5); ctx.fill(); roundRect(17,-22,11,34,5); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(-22,14,6,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(23,14,6,0,Math.PI*2); ctx.fill();
  // Hals + Kopf
  ctx.fillStyle = skin; ctx.fillRect(-6,-38,12,14);
  ctx.beginPath(); ctx.arc(0,-50,18,0,Math.PI*2); ctx.fill();
  // Gesicht
  ctx.fillStyle="#2a2a2a";
  if(c.fallen){
    // X_X erschrocken
    ctx.lineWidth=2; ctx.strokeStyle="#2a2a2a";
    ctx.beginPath(); ctx.moveTo(-10,-54); ctx.lineTo(-4,-48); ctx.moveTo(-4,-54); ctx.lineTo(-10,-48);
    ctx.moveTo(4,-54); ctx.lineTo(10,-48); ctx.moveTo(10,-54); ctx.lineTo(4,-48); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-42,4,0,Math.PI*2); ctx.fill(); // offener Mund
  } else {
    ctx.beginPath(); ctx.arc(-6,-52,2.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-52,2.2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#b5645a"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-46,5,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
  }
  // Haare
  ctx.fillStyle = c.hair;
  if(c.hairStyle==="longStraight"){
    ctx.beginPath(); ctx.arc(0,-52,19,Math.PI,0); ctx.fill();
    roundRect(-19,-54,9,42,5); ctx.fill(); roundRect(10,-54,9,42,5); ctx.fill();
  } else if(c.hairStyle==="buzz"){
    ctx.beginPath(); ctx.arc(0,-52,18,Math.PI*1.05,-0.05*Math.PI); ctx.fill();
  } else if(c.hairStyle==="curls"){
    for(let a=-1;a<=1;a+=0.5){ ctx.beginPath(); ctx.arc(a*12,-64,7,0,Math.PI*2); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0,-54,19,Math.PI,0); ctx.fill();
  }
  ctx.restore();

  // Sprechblase
  if(c.bubble){
    drawBubble(c.x, c.y - (c.fallen?40:108)*c.scale, c.bubble);
  }
}

function drawBubble(x,y,text){
  ctx.font = "15px 'Comic Sans MS', sans-serif";
  const w = ctx.measureText(text).width + 24;
  ctx.fillStyle = "#fff";
  roundRect(x - w/2, y - 34, w, 30, 12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-6,y-6); ctx.lineTo(x+6,y-6); ctx.lineTo(x,y+4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2a2440"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(text, x, y-19);
}

function drawSpider(){
  if(!spider.show) return;
  const {x,y} = spider;
  ctx.strokeStyle="#111"; ctx.lineWidth=2;
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x-16, y-6+i*5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+8,y); ctx.lineTo(x+16, y-6+i*5); ctx.stroke();
  }
  ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#e23b3b"; ctx.beginPath(); ctx.arc(x-3,y-2,1.6,0,Math.PI*2); ctx.arc(x+3,y-2,1.6,0,Math.PI*2); ctx.fill();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawRoom();
  for(const k of ["juliet","lotte","tobi","jamal"]) drawChar(chars[k]);
  drawSpider();
}

/* ---------- Geschichte (Schritte) ---------- */
function clearBubbles(){ for(const k in chars) chars[k].bubble=null; }

const steps = [
  ()=>{ clearBubbles(); spider.show=false; caption.textContent="In einem gemütlichen Raum stehen Juliet, Lotte, Tobi und Jamal zusammen."; },
  ()=>{ clearBubbles(); chars.lotte.bubble="Was für ein schönes Wetter heute!"; caption.textContent="Lotte schaut aus dem Fenster."; },
  ()=>{ clearBubbles(); chars.juliet.bubble="Ja, die Sonne scheint so schön!"; caption.textContent="Juliet stimmt zu."; },
  ()=>{ clearBubbles(); chars.tobi.bubble="Perfekt zum Draußenspielen!"; caption.textContent="Tobi freut sich."; },
  ()=>{ clearBubbles(); chars.lotte.bubble="Hihi... ich hab eine Überraschung!"; spider.show=true; spider.x=chars.lotte.x+30; spider.y=chars.lotte.y-10; caption.textContent="Lotte holt heimlich eine Gummispinne hervor..."; },
  ()=>{ clearBubbles(); spider.x=chars.tobi.x-30; spider.y=chars.tobi.y-30; chars.tobi.fallen=true; chars.tobi.side=1; chars.tobi.bubble="Aaaaah!"; caption.textContent="Tobi erschrickt total und fällt vor Schreck um!"; },
  ()=>{ clearBubbles(); chars.lotte.bubble="Hahahaha! Reingelegt!"; caption.textContent="Lotte lacht – es war nur ein Streich!"; },
  ()=>{ clearBubbles(); spider.show=false; chars.juliet.bubble="Jetzt bist du dran, Jamal!"; spider.show=true; spider.x=chars.juliet.x+30; spider.y=chars.juliet.y-10; caption.textContent="Juliet schnappt sich die Gummispinne."; },
  ()=>{ clearBubbles(); spider.x=chars.jamal.x-30; spider.y=chars.jamal.y-30; chars.jamal.fallen=true; chars.jamal.side=-1; chars.jamal.bubble="Waaass?!"; caption.textContent="Jamal erschrickt und plumpst auch um!"; },
  ()=>{ clearBubbles(); spider.show=false; chars.juliet.bubble="Hihi, mit den beiden sind wir fertig!"; caption.textContent="Die Mädchen kichern."; },
  ()=>{ clearBubbles(); chars.lotte.bubble="Jetzt schnell weiter zu Ali!"; caption.textContent="Auf zum nächsten Streich..."; },
  ()=>{ clearBubbles(); chars.tobi.fallen=false; chars.jamal.fallen=false; chars.tobi.bubble="Ihr seid so gemein – aber lustig! 😄"; chars.jamal.bubble="Nächstes Mal erschrecke ICH euch!"; caption.textContent="Alle lachen zusammen. ENDE 🎉"; },
];

let step = 0;
function doStep(){
  if(step >= steps.length) step = 0;
  steps[step]();
  render();
  step++;
}
function restart(){
  for(const k in chars){ chars[k].fallen=false; chars[k].bubble=null; chars[k].side=undefined; }
  spider.show=false; step=0;
  caption.textContent="Klicke auf „Weiter", um die Geschichte zu starten!";
  render();
}

document.getElementById("nextBtn").addEventListener("click", doStep);
document.getElementById("restartBtn").addEventListener("click", restart);
canvas.addEventListener("click", doStep);

render();
</script>
</body>
</html>
